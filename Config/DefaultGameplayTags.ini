; GAS Phase 0: GameplayTag 분류 정의
; 후속 Phase 에서 Ability/Cooldown/Skill 태그 추가 예정

[/Script/GameplayTags.GameplayTagsSettings]
ImportTagsFromConfig=True
WarnOnInvalidTags=True
ClearInvalidTags=False
FastReplication=False
InvalidTagCharacters="\"\',"
NumBitsForContainerSize=6
NetIndexFirstBitSegment=16

; --- Ability 태그 ---
+GameplayTagList=(Tag="Ability",DevComment="Ability 태그 컨테이너")
+GameplayTagList=(Tag="Ability.Attack",DevComment="공격 ability 분류")
+GameplayTagList=(Tag="Ability.Attack.Basic",DevComment="기본 일반 공격")
+GameplayTagList=(Tag="Ability.Skill",DevComment="스킬 ability 분류 (예약)")

; --- Cooldown 태그 ---
+GameplayTagList=(Tag="Cooldown",DevComment="쿨다운 태그 컨테이너")
+GameplayTagList=(Tag="Cooldown.Attack",DevComment="공격 쿨다운 분류")
+GameplayTagList=(Tag="Cooldown.Attack.Basic",DevComment="기본 공격 쿨다운")
+GameplayTagList=(Tag="Cooldown.Skill",DevComment="스킬 쿨다운 분류 (예약)")

; --- 캐릭터 상태 태그 ---
+GameplayTagList=(Tag="State",DevComment="캐릭터 상태 컨테이너")
+GameplayTagList=(Tag="State.Dead",DevComment="사망 상태")
+GameplayTagList=(Tag="State.Stunned",DevComment="스턴 상태 (이동 차단)")

; --- 데미지 타입 태그 ---
+GameplayTagList=(Tag="Damage",DevComment="데미지 분류 컨테이너")
+GameplayTagList=(Tag="Damage.Type",DevComment="데미지 타입 분류")
+GameplayTagList=(Tag="Damage.Type.Physical",DevComment="물리 데미지")
+GameplayTagList=(Tag="Damage.Type.Magic",DevComment="마법 데미지")

; --- SetByCaller 데이터 키 ---
+GameplayTagList=(Tag="Data",DevComment="GE SetByCaller 데이터 키 컨테이너")
+GameplayTagList=(Tag="Data.Damage",DevComment="GE_Damage 의 SetByCaller magnitude key")
